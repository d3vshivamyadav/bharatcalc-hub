<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#005d42" />
  <title>Page Not Found (404) — BharatCalc Hub</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #faf8ff;
      color: #131b2e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(19, 27, 46, 0.08);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: contain;
    }
    .brand span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: #131b2e;
    }
    .pill {
      display: inline-block;
      background: #f2f3ff;
      color: #005d42;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 28px;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 24px;
      color: #3e4943;
      font-size: 15px;
      line-height: 1.6;
    }
    .cta {
      display: inline-block;
      background: #005d42;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .cta:hover { background: #047857; }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding-top: 18px;
      border-top: 1px solid #dae2fd;
    }
    .links a {
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      color: #006398;
      background: #f2f3ff;
      padding: 6px 12px;
      border-radius: 8px;
    }
    .links a:hover { background: #dae2fd; }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">
      <img src="/BharatCalc%20Logo.png" alt="BharatCalc Hub Logo" width="44" height="44" />
      <span>BharatCalc Hub</span>
    </div>
    <div><span class="pill">Error 404</span></div>
    <h1>Page Not Found</h1>
    <p>The requested page does not exist or has moved. Return to BharatCalc Hub to access all six Indian tax and financial calculators.</p>
    <a class="cta" href="/">Open All Calculators</a>
    <nav class="links" aria-label="Calculator shortcuts">
      <a href="/#income-tax">Income Tax (TY 2026–27)</a>
      <a href="/#gst-calculator">GST 2.0</a>
      <a href="/#sip-mutual-fund">SIP Wealth</a>
      <a href="/#hra-rent-exemption">HRA Exemption</a>
      <a href="/#fd-rd-returns">FD &amp; RD</a>
      <a href="/#nps-tax-savings">NPS 80CCD</a>
    </nav>
  </main>
</body>

</html>
